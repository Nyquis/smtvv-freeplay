name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.59.0
          cache: true
      - name: Run tests
        run: pixi run test
      - name: Build release zip
        run: pixi run package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "Retrying release publish in $((attempt * 10))s..."
              sleep $((attempt * 10))
            fi
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              if gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber; then
                exit 0
              fi
            elif gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --title "SMTVV Freeplay ${GITHUB_REF_NAME#v}" \
              --generate-notes; then
              exit 0
            fi
            echo "Attempt $attempt failed."
          done
          echo "Release publish failed after 3 attempts." >&2
          exit 1
