name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.59.0
          cache: true
      - name: Run tests
        run: pixi run test
